<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 73 21" preserveAspectRatio="none">
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fcfcfc"/>
      <stop offset="1" stop-color="#f3f3f3"/>
    </linearGradient>
    <linearGradient id="defaultRim" x2="0" y2="1">
      <stop stop-color="#48d8fb"/>
      <stop offset="1" stop-color="#3dcdf0"/>
    </linearGradient>
    <linearGradient id="hoverRim" x2="0" y2="1">
      <stop stop-color="#fafdfe"/>
      <stop offset="1" stop-color="#e8f5fc"/>
    </linearGradient>
    <linearGradient id="heldRim" x2="0" y2="1">
      <stop stop-color="#9eb0ba"/>
      <stop offset="1" stop-color="#68b3db"/>
    </linearGradient>
    <linearGradient id="greyFace" x2="0" y2="1">
      <stop stop-color="#f3f3f3"/>
      <stop offset=".47" stop-color="#ebebeb"/>
      <stop offset=".47" stop-color="#dedede"/>
      <stop offset="1" stop-color="#cecece"/>
    </linearGradient>
    <linearGradient id="blueFace" x2="0" y2="1">
      <stop stop-color="#ecf7fe"/>
      <stop offset=".47" stop-color="#d8f0fc"/>
      <stop offset=".47" stop-color="#bfe7fd"/>
      <stop offset="1" stop-color="#a5d8f5"/>
    </linearGradient>
    <linearGradient id="heldFace" x2="0" y2="1">
      <stop stop-color="#edf6fd"/>
      <stop offset=".53" stop-color="#c5e5f6"/>
      <stop offset=".53" stop-color="#9bd3f0"/>
      <stop offset="1" stop-color="#70b8de"/>
    </linearGradient>
    <!-- Run's idle and default faces at the native 144 DPI dimensions. -->
    <linearGradient id="runPaper" x2="0" y2="1">
      <stop stop-color="#fcfcfc"/>
      <stop offset=".475" stop-color="#fafafa"/>
      <stop offset=".475" stop-color="#f6f6f6"/>
      <stop offset="1" stop-color="#f3f3f3"/>
    </linearGradient>
    <linearGradient id="runGrey" x2="0" y2="1">
      <stop stop-color="#f2f2f2"/>
      <stop offset=".474" stop-color="#ebebeb"/>
      <stop offset=".474" stop-color="#dddddd"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <linearGradient id="runCyan" x2="0" y2="1">
      <stop stop-color="#32d5fe"/>
      <stop offset=".475" stop-color="#31d4fe"/>
      <stop offset=".475" stop-color="#2cd2fc"/>
      <stop offset="1" stop-color="#27cffb"/>
    </linearGradient>
    <linearGradient id="runInnerRim" x2="0" y2="1">
      <stop stop-color="#9fe8fc"/>
      <stop offset=".474" stop-color="#9ae5fa"/>
      <stop offset=".474" stop-color="#8bdef7"/>
      <stop offset="1" stop-color="#7dd6f2"/>
    </linearGradient>
    <linearGradient id="runBlue" x2="0" y2="1">
      <stop stop-color="#ebf5fb"/>
      <stop offset=".472" stop-color="#e5f2fa"/>
      <stop offset=".472" stop-color="#cde8f6"/>
      <stop offset="1" stop-color="#b9dcf0"/>
    </linearGradient>
    <rect id="edge" width="73" height="21" rx="2.5"/>
    <rect id="rim" x="1" y="1" width="71" height="19" rx="1.7"/>
    <rect id="face" x="2" y="2" width="69" height="17" rx=".7"/>
    <g id="normal">
      <use href="#edge" fill="#707070"/>
      <use href="#rim" fill="url(#paper)"/>
      <use href="#face" fill="url(#greyFace)"/>
    </g>
    <g id="default">
      <use href="#edge" fill="#3c7fb1"/>
      <use href="#rim" fill="url(#defaultRim)"/>
      <use href="#face" fill="url(#greyFace)"/>
    </g>
    <rect id="run-edge" width="123" height="42" rx="3"/>
    <rect id="run-rim" x="1" y="1" width="121" height="40" rx="2"/>
    <rect id="run-inner" x="2" y="2" width="119" height="38" rx="1.5"/>
    <g id="run-normal">
      <use href="#run-edge" fill="#707070"/>
      <use href="#run-rim" fill="url(#runPaper)"/>
      <use href="#run-inner" fill="url(#runGrey)"/>
    </g>
    <g id="run-default">
      <use href="#run-edge" fill="#3c7fb1"/>
      <use href="#run-rim" fill="url(#runCyan)"/>
      <use href="#run-inner" fill="url(#runInnerRim)"/>
      <rect x="3" y="3" width="117" height="36" rx="1" fill="url(#runBlue)"/>
    </g>
    <g id="hover">
      <use href="#edge" fill="#3c7fb1"/>
      <use href="#rim" fill="url(#hoverRim)"/>
      <use href="#face" fill="url(#blueFace)"/>
    </g>
    <g id="pressed">
      <use href="#edge" fill="#2c628b"/>
      <use href="#rim" fill="url(#heldRim)"/>
      <use href="#face" fill="url(#heldFace)"/>
    </g>
    <path id="choice-arrow" d="M0 0H7V1H6V2H5V3H4V4H3V3H2V2H1V1H0Z"/>
  </defs>
  <use href="#normal"/>
</svg>
