[General]
# Whole-number scale for the dialog; 0 picks one from the screen height.
scale=0
# classic: 1995/1998 key dialog on teal. 2000: product banner on blue, buttons along the bottom.
loginStyle=classic
# The 2000 banner's logo (a file next to this one) and text; Setup copies the Start logo
# and writes the Start menu banner text.
brandLogo=
brandText=Chicago95
# The company: above the name and, without a company logo (a file next to this one), top right.
brandCompany=KDE
companyLogo=
brandEdition=Professional
brandTagline=Built on Linux Technology
# Empty: the title bar takes the colour scheme's selection colour. A colour, or start,end for a
# gradient, pins it instead.
titleActive=
