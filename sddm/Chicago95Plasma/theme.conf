[General]
# Screen pixels per classic pixel; Setup writes the screen's scale rounded. 0 picks one from the screen size.
scale=0
# classic: 1995/1998 key dialog on teal. 2000: product banner on blue, buttons along the bottom.
# The 2000 banner is brand-banner.png next to this file; Setup draws it with the user's logo and texts.
loginStyle=classic
# luna: the user's branding in the welcome screen's wordmark (empty brandText: the Windows XP wordmark itself).
# brandLogo is a file next to this one; Setup copies the logo there.
brandText=
brandLogo=
company=
edition=
# The title bar's text; %h is the computer's name.
loginTitle=Welcome to Windows
# classic: the line above the fields, and the picture beside them (a file next to this one).
loginMessage=Type a user name and password to log on to Windows.
loginIcon=key-9x.png
# Empty: the title bar takes the colour scheme's selection colour. A colour, or start,end for a
# gradient, pins it instead.
titleActive=
