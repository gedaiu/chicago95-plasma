<?xml version="1.0" encoding="UTF-8"?>
<!-- The classic error icon: a red disc with a white cross over its shadow, drawn at 32x32. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff6060"/>
      <stop offset="0.45" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#c00000"/>
    </radialGradient>
  </defs>
  <ellipse cx="17.5" cy="17.5" rx="14" ry="14" fill="#000000" fill-opacity="0.3"/>
  <circle cx="15" cy="15" r="14" fill="url(#disc)" stroke="#a00000" stroke-width="1"/>
  <path d="M10 10 L20 20 M20 10 L10 20" stroke="#ffffff" stroke-width="3.2" stroke-linecap="square"/>
</svg>
