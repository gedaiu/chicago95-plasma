[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["bin/chicago95-*"]
extend-exclude = ["data/clippy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PLW"]
ignore = ["E501", "E402", "E731", "B905", "PLW2901", "PLW1510", "PLW0108", "PLW0603"]

[tool.ruff.format]
quote-style = "double"
