[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["bin/chicago95-*"]
extend-exclude = ["data/clippy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PLW"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# These programs extend sys.path (or set Qt's environment) before importing chicago95ui and Qt.
"bin/*" = ["E402"]
"lib/chicago95ui.py" = ["E402"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["lib", "bin", "setup", "aurorae", "plasma-style"]
