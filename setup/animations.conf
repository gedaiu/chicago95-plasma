# The animations Display > Effects offers, read by Setup (setup/steps.sh) and the Control Panel (lib/chicago95animations.py).
# EVENT|setting key|label|KWin exclusive category, or - for none|group on the Effects tab
# CHOICE|setting key|value|label|KWin effect ids it turns on; id/Flag also sets kwinrc [Effect-id] Flag=true
# CLASSIC|look|setting key|value: what the look's Windows did, for the Effects tab's Classic button
# UNSET|setting key|value: what happens while nothing is chosen, for events no KWin effect decides
# Installed effects in an event's exclusive category (Burn-My-Windows and the like) are offered beside these.

EVENT|ANIM_WINDOWS|Open and close windows:|toplevel-open-close-animation|Windows
CHOICE|ANIM_WINDOWS|none|None|
CHOICE|ANIM_WINDOWS|scale|Scale|scale
CHOICE|ANIM_WINDOWS|glide|Glide|glide
CHOICE|ANIM_WINDOWS|fade|Fade|fade

EVENT|ANIM_MINIMIZE|Minimize and restore:|minimize|Windows
CHOICE|ANIM_MINIMIZE|none|None|
CHOICE|ANIM_MINIMIZE|zoom|Title bar zoom|chicago95zoom/Minimize
CHOICE|ANIM_MINIMIZE|squash|Squash|squash
CHOICE|ANIM_MINIMIZE|magiclamp|Magic Lamp|magiclamp

EVENT|ANIM_MAXIMIZE|Maximize and restore:|maximize|Windows
CHOICE|ANIM_MAXIMIZE|none|None|
CHOICE|ANIM_MAXIMIZE|zoom|Title bar zoom|chicago95zoom/Maximize
CHOICE|ANIM_MAXIMIZE|stretch|Stretch|maximize fullscreen

EVENT|ANIM_DIALOGS|Dialogs:|-|Windows
CHOICE|ANIM_DIALOGS|none|None|
CHOICE|ANIM_DIALOGS|dim|Dim the window behind|dialogparent
CHOICE|ANIM_DIALOGS|sheet|Slide out of the title bar|sheet

EVENT|ANIM_WOBBLY|Wobbly windows|-|Windows
CHOICE|ANIM_WOBBLY|no|No|
CHOICE|ANIM_WOBBLY|yes|Yes|wobblywindows

EVENT|ANIM_SHOW_DESKTOP|Show the desktop:|show-desktop|Desktop and taskbar
CHOICE|ANIM_SHOW_DESKTOP|none|None|
CHOICE|ANIM_SHOW_DESKTOP|aperture|Window Aperture|windowaperture
CHOICE|ANIM_SHOW_DESKTOP|eye|Eye on Screen|eyeonscreen

EVENT|ANIM_DESKTOPS|Switch desktops:|desktop-animations|Desktop and taskbar
CHOICE|ANIM_DESKTOPS|none|None|
CHOICE|ANIM_DESKTOPS|slide|Slide|slide
CHOICE|ANIM_DESKTOPS|fade|Fade|fadedesktop

EVENT|ANIM_SESSION|Log on and log off:|-|Desktop and taskbar
CHOICE|ANIM_SESSION|none|None|
CHOICE|ANIM_SESSION|fade|Fade|login logout

EVENT|ANIM_MENUS|Menus:|-|Desktop and taskbar
CHOICE|ANIM_MENUS|none|None|
CHOICE|ANIM_MENUS|slide|Slide|slidingpopups
CHOICE|ANIM_MENUS|fade|Fade|fadingpopups
CHOICE|ANIM_MENUS|both|Slide and fade|slidingpopups fadingpopups

EVENT|ANIM_NOTIFICATIONS|Notifications:|-|Desktop and taskbar
CHOICE|ANIM_NOTIFICATIONS|none|None|
CHOICE|ANIM_NOTIFICATIONS|slide|Slide|chicago95notifications

EVENT|ANIM_TASKBAR|Taskbar buttons:|-|Desktop and taskbar
CHOICE|ANIM_TASKBAR|none|None|
CHOICE|ANIM_TASKBAR|slide|Slide into place|
UNSET|ANIM_TASKBAR|slide

EVENT|ANIM_SPEED|Speed:|-|Desktop and taskbar
CHOICE|ANIM_SPEED|0|Off|
CHOICE|ANIM_SPEED|0.5|Fast|
CHOICE|ANIM_SPEED|1|Normal|
CHOICE|ANIM_SPEED|2|Slow|
UNSET|ANIM_SPEED|1

