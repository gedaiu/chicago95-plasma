name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime, fonts and tools the tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fontconfig fonts-liberation fonts-dejavu-core
      - name: Python packages
        run: pip install PySide6 -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --basetemp=test-output
      - name: Comparison images (originals beside our renders)
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/render_report.py report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-report
          path: report/*.png
      - name: Pixel diffs of failed comparisons
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diffs
          path: test-output/**/*.png
