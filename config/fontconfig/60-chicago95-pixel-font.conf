<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Chicago95: MS W98 UI is a pixel font drawn on an 11px grid. At 11px (1x) and 22px (2x) its edges
     land on whole pixels: drawn unsmoothed, they stay as sharp as the originals' text. At any other
     size (16 to 18px on a 1.5x screen) unsmoothed edges are jagged, so there it is smoothed, in grey
     (no colour fringes), with full hinting so the strokes keep to whole pixels and stay dark.
     Setup installs this file (tests/test_fontconfig.py). -->
<fontconfig>
  <match target="font">
    <test name="family"><string>MS W98 UI</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family"><string>MS W98 UI</string></test>
    <test name="pixelsize" compare="more_eq"><double>10.5</double></test>
    <test name="pixelsize" compare="less"><double>11.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>MS W98 UI</string></test>
    <test name="pixelsize" compare="more_eq"><double>21.5</double></test>
    <test name="pixelsize" compare="less"><double>22.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
