<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Chicago95: MS W98 UI is a pixel font; drawn without smoothing, its edges stay as sharp as the
     originals' text (title bars, panels and every program using it). Setup installs this file. -->
<fontconfig>
  <match target="font">
    <test name="family"><string>MS W98 UI</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
