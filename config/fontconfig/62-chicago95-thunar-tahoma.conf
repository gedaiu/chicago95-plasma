<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Explorer's 120 DPI menu uses monochrome Tahoma. GTK 3 can request the
       font at twice its logical size before the compositor scales the window. -->
  <match target="font">
    <test target="pattern" name="prgname"><string>thunar</string></test>
    <test name="family" compare="contains"><string>Tahoma</string></test>
    <test name="pixelsize" compare="less_eq"><double>22</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
